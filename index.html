<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Website</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="site.config.js"></script>
  <style>
    :root {
      --accent: #c2410c;
      --bg: #ffffff;
      --bg-soft: #f6f5f3;
      --text: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --radius: 14px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --bg-soft: #1f1c19;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --line: #2e2a26;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    section { padding: 64px 0; }
    section:nth-of-type(even) { background: var(--bg-soft); }
    h1, h2, h3 { line-height: 1.2; margin: 0 0 12px; }
    h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
    .muted { color: var(--muted); }

    header.top {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; font-size: 1.1rem; }
    .brand img { height: 36px; width: auto; }
    nav a { text-decoration: none; margin-left: 18px; color: var(--muted); font-size: .95rem; }
    nav a:hover { color: var(--text); }
    @media (max-width: 640px) { nav { display: none; } }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px; border-radius: 999px;
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
      border: 0; cursor: pointer; font: inherit; font-weight: 600;
    }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }

    .hero { padding: 88px 0 72px; }
    .hero.has-image { background-size: cover; background-position: center; color: #fff; }
    .hero.has-image .muted { color: #e7e5e4; }
    .hero.has-image .btn.ghost { color: #fff; border-color: rgba(255,255,255,.5); }
    .hero h1 { font-size: clamp(2rem, 6vw, 3.4rem); max-width: 18ch; }
    .hero p { font-size: 1.15rem; max-width: 52ch; }
    .hero .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }

    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
    .card h3 { font-size: 1.1rem; }
    .card h3::before { content: ""; display: block; width: 28px; height: 4px; border-radius: 4px; background: var(--accent); margin-bottom: 14px; }

    .gallery { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .gallery img { aspect-ratio: 4/3; object-fit: cover; border-radius: var(--radius); width: 100%; }

    blockquote { margin: 0; }
    blockquote p { margin: 0 0 10px; }
    blockquote cite { font-style: normal; font-weight: 600; color: var(--muted); }

    .contact { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .contact dl { margin: 0; }
    .contact dt { font-weight: 600; margin-top: 14px; }
    .contact dd { margin: 2px 0 0; color: var(--muted); }
    .hours { width: 100%; border-collapse: collapse; }
    .hours td { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .hours td:last-child { text-align: right; color: var(--muted); }
    .map { width: 100%; height: 300px; border: 0; border-radius: var(--radius); }

    form.enquiry { display: grid; gap: 12px; max-width: 560px; }
    form.enquiry input, form.enquiry textarea {
      font: inherit; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    form.enquiry textarea { min-height: 110px; resize: vertical; }

    footer { padding: 32px 0 96px; border-top: 1px solid var(--line); font-size: .9rem; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }
    footer .social a { margin-right: 14px; }

    .wa-float {
      position: fixed; right: 16px; bottom: 16px; z-index: 20;
      width: 56px; height: 56px; border-radius: 50%;
      background: #25d366; display: grid; place-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .wa-float svg { width: 30px; height: 30px; fill: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#top" id="brand"></a>
      <nav id="nav"></nav>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="wrap">
        <h1 id="hero-title"></h1>
        <p class="muted" id="hero-tagline"></p>
        <div class="actions" id="hero-actions"></div>
      </div>
    </section>

    <section id="about">
      <div class="wrap">
        <h2 data-label="about">About us</h2>
        <p class="muted" id="about-text"></p>
      </div>
    </section>

    <section id="services">
      <div class="wrap">
        <h2 data-label="services">What we offer</h2>
        <div class="grid" id="services-grid"></div>
      </div>
    </section>

    <section id="gallery">
      <div class="wrap">
        <h2 data-label="gallery">Gallery</h2>
        <div class="gallery" id="gallery-grid"></div>
      </div>
    </section>

    <section id="reviews">
      <div class="wrap">
        <h2 data-label="reviews">What customers say</h2>
        <div class="grid" id="reviews-grid"></div>
      </div>
    </section>

    <section id="contact">
      <div class="wrap">
        <h2 data-label="contact">Visit or contact us</h2>
        <div class="contact">
          <div>
            <dl id="contact-list"></dl>
            <div id="hours-block">
              <h3 style="margin-top:24px" data-label="hours">Opening hours</h3>
              <table class="hours" id="hours-table"></table>
            </div>
          </div>
          <iframe class="map" id="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map"></iframe>
        </div>
      </div>
    </section>

    <section id="enquiry">
      <div class="wrap">
        <h2 id="enquiry-heading"></h2>
        <form class="enquiry" id="enquiry-form">
          <input name="name" placeholder="Your name" data-label-placeholder="yourName" required />
          <textarea name="message" placeholder="Your message" data-label-placeholder="yourMessage" required></textarea>
          <button class="btn" type="submit" id="enquiry-button"></button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span id="copyright"></span>
      <span class="social" id="social"></span>
    </div>
  </footer>

  <a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3z"/></svg>
  </a>

  <script src="app.js"></script>
</body>
</html>
