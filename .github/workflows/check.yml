name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: for f in app.js site.config.js examples/*.js; do node --check "$f"; done
      - name: Configs and translations
        run: node tests/check.mjs
      - name: Page renders in Chrome
        run: bash tests/render.sh
